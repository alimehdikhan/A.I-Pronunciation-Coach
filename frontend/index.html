<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Phoneme-level pronunciation coaching powered by Whisper. Record a phrase, see exactly which sounds slipped, and fix them with guided drills." />
    <meta name="theme-color" content="#07070b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pronunciation Coach</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('pc-settings') || '{}').state || {}
        var theme = saved.theme || 'dark'
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
      // Arrived from a cached copy of the old page (see backend/spa.py): drop its cache-buster.
      if (/[?&]_reload=/.test(location.search)) {
        var url = new URL(location.href)
        url.searchParams.delete('_reload')
        history.replaceState(history.state, '', url)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pronunciation Coach needs JavaScript to record and analyse speech.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
