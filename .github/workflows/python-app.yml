name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check backend/ tests/

      - name: Run tests
        env:
          PRONUNCIATION_COACH_LOAD_MODELS_ON_STARTUP: "0"
          PYTHONPATH: "."
        run: |
          pytest -q

      - name: Check imports compile
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/models.py
          python -m py_compile backend/pronunciation.py
          python -m py_compile backend/agent.py
